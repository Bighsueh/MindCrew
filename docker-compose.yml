services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dtai}
      POSTGRES_DB: ${POSTGRES_DB:-dtai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mindcrew
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtai} -d ${POSTGRES_DB:-dtai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - mindcrew
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dtai}:${POSTGRES_PASSWORD:-dtai}@postgres:5432/${POSTGRES_DB:-dtai}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # LLM provider 設定改為 DB 真理來源（Phase 25），這裡不再注入任何 endpoint / key。
      LLM_MAX_TOKENS_PER_CALL: ${LLM_MAX_TOKENS_PER_CALL:-2048}
      LLM_PROJECT_RPM_LIMIT: ${LLM_PROJECT_RPM_LIMIT:-30}
      LLM_GLOBAL_RPM_LIMIT: ${LLM_GLOBAL_RPM_LIMIT:-116}
      LLM_CALL_TIMEOUT_SECONDS: "60"  # 顯式設定，防止被 .env 覆蓋
      LLM_STREAM_CONNECT_TIMEOUT_SECONDS: "15"
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,https://frontend.mindcrew.orb.local,https://backend.mindcrew.orb.local}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-dummy}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://embedding.example.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-8B}
      # Phase 26 / S2 — Fernet master key for at-rest encryption of
      # llm_providers.api_key. Required in APP_ENV=production.
      LLM_PROVIDER_KEY_MASTER: ${LLM_PROVIDER_KEY_MASTER}
      # Initial admin password seeded by migration d2e3f4a5b6c7. Required
      # the first time migrations run; ignored on subsequent runs (admin
      # already exists). Set in .env (see .env.example).
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      SIDECAR_URL: http://sidecar:4000
      # Neutralize host-injected proxy env (OrbStack injects IPv6 CIDR into NO_PROXY
      # which httpx cannot parse → InvalidURL "Invalid port: 'b51a:cc66:f0::'")
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      no_proxy: ""
      all_proxy: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sidecar:
        condition: service_started
    networks:
      - mindcrew
    restart: unless-stopped
    labels:
      dev.orbstack.domains: backend.mindcrew.orb.local
      dev.orbstack.http_port: "8000"

  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    environment:
      SIDECAR_PORT: "4000"
      YJS_DATA_DIR: /data
    ports:
      - "4000:4000"
    volumes:
      - yjsdata:/data
    networks:
      - mindcrew
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - sidecar
    networks:
      - mindcrew
    restart: unless-stopped
    labels:
      dev.orbstack.domains: frontend.mindcrew.orb.local
      dev.orbstack.http_port: "80"

networks:
  mindcrew:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  yjsdata:

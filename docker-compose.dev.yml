services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dtai
      POSTGRES_PASSWORD: dtai
      POSTGRES_DB: dtai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  sidecar:
    build: ./sidecar
    ports:
      - "4000:4000"
    environment:
      SIDECAR_PORT: "4000"

volumes:
  pgdata:
  redisdata:
